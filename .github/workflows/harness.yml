# Harness CI (session 3 spike, session 4-5 B1a characterization; D-031 / harness.md W1, W8, W11, W12; D-044 guard).
# legacy: builds the OLD bot (a5a3442 code) with .NET 8 against Core f6fb55b and runs a start smoke on
# Linux and Windows, so the platform for characterization is chosen from evidence (session 3, "measure first").
# Core is pinned by full SHA here; submodules wait for B1b (D-030).
name: harness

on:
  push:
    branches: [ 'rework/bot' ]
  pull_request:
    branches: [ 'rework/bot' ]
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_LEGACY_SHA: f6fb55bcefd19fd272c1d9cdb7d6d1f62f23fe3a   # xcore-0.9.7a, the bot's build pin (CLAUDE.md §4)
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  legacy:
    name: legacy build + smoke (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ ubuntu-latest, windows-latest ]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - name: Checkout Spixi-Bot
        uses: actions/checkout@v4
        with:
          path: Spixi-Bot

      # The bot csproj imports ..\..\Ixian-Core\IXICore.projitems (SpixiBot/SpixiBot.csproj), so Core must sit
      # beside the repo folder.
      - name: Checkout Ixian-Core (legacy pin)
        uses: actions/checkout@v4
        with:
          repository: ixian-platform/Ixian-Core
          ref: ${{ env.CORE_LEGACY_SHA }}
          path: Ixian-Core

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      # Linux: the unpatched bot cannot start (registry call, Program.cs:50/204; run 36840465376). CI-only patch.
      - name: CI-only Linux start patch
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./Spixi-Bot/tests/smoke/patch-linux-start.ps1 -File Spixi-Bot/SpixiBot/Program.cs

      # Build the csproj, not the sln: the sln also lists the Core .shproj. SolutionDir is set because the
      # csproj's HTML copy target uses it.
      - name: Build bot (Release)
        shell: pwsh
        run: dotnet build Spixi-Bot/SpixiBot/SpixiBot.csproj -c Release "-p:SolutionDir=${{ github.workspace }}/Spixi-Bot/"

      # Windows: unpatched bot in its own console window (Console.Clear throws on redirected stdout, Program.cs:142).
      - name: Start smoke
        shell: pwsh
        run: ./Spixi-Bot/tests/smoke/bot-smoke.ps1 -BotDir Spixi-Bot/SpixiBot/bin/Release/net8.0 -OutDir smoke-out ${{ runner.os == 'Windows' && '-OwnConsole' || '' }}

      - name: Upload smoke logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-${{ matrix.os }}
          path: smoke-out
          if-no-files-found: warn

  # B1a characterization (research D §8 items 1-7) with the legacy bot and SimClients (store + redesign rules, both
  # on Core k: W3). `normal` runs every scenario (14 cases; each starts its own bot, with up to 60 s for the D-044
  # header wait). Every other variant is a self-test (L5, L18): it breaks ONE thing on purpose (the bot via
  # break-bot.ps1, or for `unknown` the client Core via break-core.ps1), runs only the scenario that must catch it,
  # and passes only if every case of that scenario failed with the expected per-case marker.
  harness:
    name: harness ${{ matrix.variant }} (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        # Windows only (session 3, CI run 36841419911, D-043): on Linux the old bot hangs its API on the first
        # settings save (Settings.cs:109/:144 recursion).
        os: [ windows-latest ]
        variant: [ normal, relay, ack, info, cursor, seed-none, reaction, delete, delete-sign, admin, servername, unknown, leave ]
        include:
          - variant: normal
            seed: testnet
            filter: ''
            markers: ''
          - variant: relay        # break-bot.ps1 relay: the bot stops relaying chat (W8)
            seed: testnet
            filter: 'scenario=relay'
            markers: 'W8-RELAY-MISSING[relay:store->redesign] W8-RELAY-MISSING[relay:redesign->store]'
          - variant: ack          # break-bot.ps1 ack: no msgReceived for chat
            seed: testnet
            filter: 'scenario=relay'
            markers: 'ACK-MISSING[relay:store->redesign] ACK-MISSING[relay:redesign->store]'
          - variant: info         # break-bot.ps1 info: no answer to getInfo
            seed: testnet
            filter: 'scenario=join'
            markers: 'JOIN-INFO-MISSING[join:store] JOIN-INFO-MISSING[join:redesign]'
          - variant: cursor       # break-bot.ps1 cursor: botGetMessages ignores the cursor
            seed: testnet
            filter: 'scenario=history'
            markers: 'CURSOR-IGNORED[history:store] CURSOR-IGNORED[history:redesign]'
          - variant: seed-none    # no bot change; no seed: the D-044 guard must report infra, not a bot bug
            seed: none
            filter: 'scenario=join'
            markers: 'INFRA-TESTNET-UNREACHABLE[join:store] INFRA-TESTNET-UNREACHABLE[join:redesign]'
          - variant: reaction     # break-bot.ps1 reaction: the bot stores a reaction but does not relay it
            seed: testnet
            filter: 'scenario=react-delete'
            markers: 'REACTION-MISSING[react-delete:store->redesign] REACTION-MISSING[react-delete:redesign->store]'
          - variant: delete       # break-bot.ps1 delete: the bot removes the message but does not relay its delete
            seed: testnet
            filter: 'scenario=react-delete'
            markers: 'DELETE-MISSING[react-delete:store->redesign] DELETE-MISSING[react-delete:redesign->store]'
          - variant: delete-sign  # break-bot.ps1 delete-sign: the bot relays its delete unsigned
            seed: testnet
            filter: 'scenario=react-delete'
            markers: 'DELETE-UNVERIFIED[react-delete:store->redesign] DELETE-UNVERIFIED[react-delete:redesign->store]'
          - variant: admin        # break-bot.ps1 admin: isAdmin always false (info still says admin)
            seed: testnet
            filter: 'scenario=react-delete'
            markers: 'ADMIN-DELETE-NOT-RELAYED[react-delete:store->redesign] ADMIN-DELETE-NOT-RELAYED[react-delete:redesign->store]'
          - variant: servername   # break-bot.ps1 servername: sendInfo sends an empty serverName
            seed: testnet
            filter: 'scenario=info'
            markers: 'INFO-SERVERNAME-MISSING[info:store] INFO-SERVERNAME-MISSING[info:redesign]'
          - variant: unknown      # break-core.ps1 unknown: the CLIENT Core FailFasts on an undefined code or action
            seed: testnet
            filter: 'scenario=unknown'
            markers: 'CLIENT-CRASHED-ON-UNKNOWN[unknown:store] CLIENT-CRASHED-ON-UNKNOWN[unknown:redesign]'
          - variant: leave        # break-bot.ps1 leave: the bot acks a leave but ignores it
            seed: testnet
            filter: 'scenario=leave'
            markers: 'LEAVE-IGNORED[leave:store] LEAVE-IGNORED[leave:redesign]'
    runs-on: ${{ matrix.os }}
    # normal: 14 cases × (bot start + header wait ≤ 60 s + scenario); the self-tests run 2 cases each.
    timeout-minutes: 60
    env:
      CORE_CLIENT_SHA: 097341acba9be1855383acf8215d779ca96efa02   # xcore-0.9.8k, the redesign's Core (W3)
    steps:
      - name: Checkout Spixi-Bot
        uses: actions/checkout@v4
        with:
          path: Spixi-Bot

      - name: Checkout Ixian-Core (legacy pin, for the bot)
        uses: actions/checkout@v4
        with:
          repository: ixian-platform/Ixian-Core
          ref: ${{ env.CORE_LEGACY_SHA }}
          path: Ixian-Core

      - name: Checkout Ixian-Core (client pin, for SimClient)
        uses: actions/checkout@v4
        with:
          repository: ixian-platform/Ixian-Core
          ref: ${{ env.CORE_CLIENT_SHA }}
          path: Ixian-Core-k

      - name: Setup .NET 8 and 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x

      - name: Deliberate break (self-test only)
        if: contains(fromJSON('["relay","ack","info","cursor","reaction","delete","delete-sign","admin","servername","leave"]'), matrix.variant)
        shell: pwsh
        run: ./Spixi-Bot/tests/smoke/break-bot.ps1 -Break ${{ matrix.variant }} -BotRoot Spixi-Bot/SpixiBot

      # The `unknown` self-test breaks the CLIENT side: SimClient compiles Core k in, so this must run before its build.
      - name: Deliberate client Core break (self-test only)
        if: matrix.variant == 'unknown'
        shell: pwsh
        run: ./Spixi-Bot/tests/smoke/break-core.ps1 -Break unknown -CoreRoot Ixian-Core-k

      - name: Build bot (.NET 8, Core f6fb55b)
        shell: pwsh
        run: dotnet build Spixi-Bot/SpixiBot/SpixiBot.csproj -c Release "-p:SolutionDir=${{ github.workspace }}/Spixi-Bot/"

      - name: Build SimClient (.NET 10, Core 097341a)
        shell: pwsh
        run: dotnet build Spixi-Bot/tests/SimClient/SimClient.csproj -c Release "-p:ClientCorePath=${{ github.workspace }}/Ixian-Core-k"

      - name: Build harness
        shell: pwsh
        run: dotnet build Spixi-Bot/tests/Harness/Harness.csproj -c Release

      - name: Run scenarios
        id: run
        timeout-minutes: 45
        shell: pwsh
        env:
          HARNESS_BOT_DIR: ${{ github.workspace }}/Spixi-Bot/SpixiBot/bin/Release/net8.0
          HARNESS_SIMCLIENT_DLL: ${{ github.workspace }}/Spixi-Bot/tests/SimClient/bin/Release/net10.0/SimClient.dll
          HARNESS_ARTIFACTS: ${{ github.workspace }}/harness-out
          HARNESS_BOT_CONSOLE: ${{ runner.os == 'Windows' && '1' || '0' }}
          HARNESS_BOT_SEED: ${{ matrix.seed }}
          FILTER: ${{ matrix.filter }}
          MARKERS: ${{ matrix.markers }}
          VARIANT: ${{ matrix.variant }}
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $filterArgs = @()
          if ($env:FILTER) { $filterArgs = @('--filter', $env:FILTER) }
          dotnet test Spixi-Bot/tests/Harness/Harness.csproj -c Release --no-build --logger "console;verbosity=detailed" @filterArgs 2>&1 | Tee-Object -FilePath harness-test.txt
          $code = $LASTEXITCODE
          . ./Spixi-Bot/tests/smoke/annotate.ps1
          # D-044: a missing testnet header is infra, not a bot failure. Say so first, in its own annotation.
          if ($env:VARIANT -ne 'seed-none' -and (Select-String -Path harness-test.txt -SimpleMatch 'INFRA-TESTNET-UNREACHABLE' -Quiet)) {
            Write-Annotation -Level error -Title 'testnet unreachable (INFRA, not a bot failure) - rerun the job' -Message ((Select-String -Path harness-test.txt -SimpleMatch 'INFRA-TESTNET-UNREACHABLE' | Select-Object -First 4 | ForEach-Object { $_.Line }) -join "`n") -MaxChunks 1
          }
          # Failure details as annotations: readable via the public API without signing in (L21).
          $fails = (Select-String -Path harness-test.txt -Pattern '(Failed |Error Message|HarnessTimeoutException|HarnessInfraException|Assert\.)' -Context 0,3 | ForEach-Object { $_.Line + "`n" + ($_.Context.PostContext -join "`n") }) -join "`n"
          if ($fails) { Write-Annotation -Level error -Title "harness $env:VARIANT failures" -Message $fails -MaxChunks 2 }
          Get-ChildItem harness-out -Filter '*.FAILED.log' -ErrorAction SilentlyContinue | Select-Object -First 2 | ForEach-Object {
            Write-Annotation -Level warning -Title ('log ' + $_.Name) -Message (Get-Content $_.FullName -Raw) -MaxChunks 4
          }
          if ($env:VARIANT -eq 'normal') { exit $code }
          # Self-test (L5, L18): the break must make every case fail, each for the expected reason.
          $missing = @($env:MARKERS -split ' ' | Where-Object { $_ -and -not (Select-String -Path harness-test.txt -SimpleMatch $_ -Quiet) })
          if ($code -ne 0 -and $missing.Count -eq 0) { Write-Host "SELF-TEST OK ($env:VARIANT): every case failed with its marker"; exit 0 }
          $msg = "SELF-TEST FAILED ($env:VARIANT): exit=$code, markers missing: [$($missing -join ', ')]"
          Write-Annotation -Level error -Title "self-test $env:VARIANT" -Message $msg -MaxChunks 1
          Write-Host $msg; exit 1

      - name: Upload harness logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: harness-${{ matrix.variant }}-${{ matrix.os }}
          path: |
            harness-out
            harness-test.txt
          if-no-files-found: warn
